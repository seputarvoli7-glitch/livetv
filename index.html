<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE STREAMING </title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }
  </style>
</head>

<body>

<video id="video" controls autoplay playsinline></video>

<script>
const video = document.getElementById("video");

const streamURL =
"https://d10btucg50kagt.cloudfront.net/6666c6d0c7e10e0ee0be55f5/684ad0046b24126facf6347e/IZkjesfc2SrM/2026/9/5/15_3_49/index.m3u8";

if (Hls.isSupported()) {

  const hls = new Hls({
    enableWorker: true,
    liveSyncDurationCount: 3
  });

  hls.loadSource(streamURL);
  hls.attachMedia(video);

  hls.on(Hls.Events.MANIFEST_PARSED, function () {
    video.muted = true;
    video.play().catch(() => {});
  });

  hls.on(Hls.Events.ERROR, function (event, data) {
    console.log("HLS Error:", data);

    if (data.fatal) {

      switch (data.type) {

        case Hls.ErrorTypes.NETWORK_ERROR:
          console.log("Network error, mencoba kembali...");
          hls.startLoad();
          break;

        case Hls.ErrorTypes.MEDIA_ERROR:
          console.log("Media error, recovery...");
          hls.recoverMediaError();
          break;

        default:
          console.log("Fatal error:", data);
          hls.destroy();
          break;
      }
    }
  });

} else if (
  video.canPlayType("application/vnd.apple.mpegurl")
) {

  video.src = streamURL;

  video.addEventListener("loadedmetadata", function () {
    video.play().catch(() => {});
  });

}
</script>

</body>
</html>
