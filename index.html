
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naver CHZZK Player</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }
    h3 { font-size: 18px; }
    video {
      width: 100%;
      max-height: 75vh;
      background: black;
    }
    #status {
      color: #ffd166;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h3>Naver CHZZK Player</h3>
  <video id="video" controls playsinline></video>
  <p id="status">Memeriksa stream...</p>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');

    const streamUrl = 'TEMPEL_URL_M3U8_LENGKAP_DI_SINI';

    if (Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: false
      });

      hls.loadSource(streamUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        status.textContent = 'Stream ditemukan. Tekan Play.';
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        status.textContent =
          'Error: ' + data.type + ' / ' + data.details +
          (data.response?.code ? ' / HTTP ' + data.response.code : '');
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      status.textContent = 'Coba tekan Play.';
    } else {
      status.textContent = 'Browser tidak mendukung HLS.';
    }
  </script>
</body>
</html>
