<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    background:#000;
}

video{
    width:100%;
    height:100vh;
    background:#000;
}

.watermark{
    position: fixed;
    top: 8px;
    right: 8px;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    text-shadow: 1px 1px 2px #000;
    z-index: 999999;
    pointer-events: none;
}
</style>
</head>
<body>
<div class="watermark">MegawatiRedspark</div>
<video id="video" controls autoplay playsinline></video>

<script>
const video = document.getElementById("video");
const streamUrl = "https://livecdn.euw1-0008.jwplive.com/live/sites/fM9jRrkn/media/PEbI6ecX/live.isml/master.m3u8";
if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play();
    });
} else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = streamUrl;
}
</script>

</body>
</html>
