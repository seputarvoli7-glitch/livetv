<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>YANSTREAM - Live Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #080b12;
      color: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      padding: 18px 0;
      text-align: center;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .logo span {
      color: #35d7ff;
    }

    .subtitle {
      color: #9aa5b5;
      font-size: 13px;
      margin-top: 7px;
    }

    .player-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid #242b39;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .watermark {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      background: #0009;
      padding: 7px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
      pointer-events: none;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 0;
      color: #aab4c4;
      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: #e8ae36;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.online {
      background: #35df91;
    }

    .dot.error {
      background: #ff5268;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 16px;
    }

    button, select {
      border: 1px solid #30394a;
      border-radius: 8px;
      background: #171e2b;
      color: white;
      padding: 12px 15px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    button.primary {
      background: #087fce;
      border-color: #087fce;
      font-weight: bold;
    }

    button:active {
      opacity: .75;
    }

    .panel {
      background: #111722;
      border: 1px solid #242b39;
      border-radius: 10px;
      padding: 15px;
      margin-top: 14px;
    }

    .panel h3 {
      font-size: 15px;
      margin: 0 0 10px;
    }

    .panel p {
      color: #aab4c4;
      font-size: 13px;
      line-height: 1.6;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .quality-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    footer {
      text-align: center;
      color: #687386;
      font-size: 12px;
      padding: 25px 0 10px;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="logo">YAN<span>STREAM</span></div>
      <div class="subtitle">LIVE PLAYER · HLS STREAMING</div>
    </header>

    <div class="player-box">
      <div class="watermark">YANSTREAM</div>
      <video id="video"
             controls
             playsinline
             autoplay
             muted
             preload="auto"></video>
    </div>

    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">Menghubungkan ke stream...</span>
    </div>

    <div class="controls">
      <button id="playButton" class="primary">▶ Putar Live</button>
      <button id="retryButton">↻ Coba Lagi</button>
      <button id="muteButton">🔊 Aktifkan Suara</button>
    </div>

    <section class="panel">
      <div class="quality-row">
        <h3>Kualitas Video</h3>
        <select id="quality">
          <option value="-1">Otomatis</option>
        </select>
      </div>
      <p id="qualityInfo">Kualitas akan mengikuti pilihan yang tersedia dari server.</p>
    </section>

    <section class="panel">
      <h3>Status Pemutar</h3>
      <p id="detail">Menyiapkan koneksi HLS...</p>
    </section>

    <footer>
      YANSTREAM · Live Player
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>

  <script>
    const video = document.getElementById("video");
    const statusText = document.getElementById("statusText");
    const dot = document.getElementById("dot");
    const detail = document.getElementById("detail");
    const quality = document.getElementById("quality");
    const qualityInfo = document.getElementById("qualityInfo");

    // Tempel URL playlist HLS terbaru di antara tanda kutip.
    const STREAM_URL = "https://ex-nlive-streaming.navercdn.com/chzzk/lip2_kr/cflexnmss2u0006/4jbahfw6kwr27ioeizfv4zg8m8o3ym99o9oi/1080p/hdntl=st%3d1792210555%7eexp%3d1792271765%7eacl%3d%2a%2f4jbahfw6kwr27ioeizfv4zg8m8o3ym99o9oi%2f%2a%7edata%3dhdntl%7ehmac%3d4f82425dbeb65b3ead59274f60895f871ebe1a7c5cedffc1a757ea39a2ca1d42/lege7isgcqcewsqtxmy3aac8o3ym99nw1v_hls_chunklist.m3u8?vp=47DEQpj8HBSa-_TIHH81HaCbnxOCk3lZ9Bo6Cw7j4_hls_playlist.m3u8?hdnts=st=1792144810~exp=1792206020~acl=*/gjocf9t8qnncyccq60hgkpfyy8mmu81f4brq/*~hmac=bc5bfef9b6f967da9ce3d9bbe960de1f1d73f812e33ed862a057a318da203dae&vp=47DEQpj8HBSa-_TIKgc8JzIZ-OGi_6-I5_uDpg";
    let hls = null;

    function setStatus(message, state = "") {
      statusText.textContent = message;
      dot.className = "dot " + state;
    }

    function setDetail(message) {
      detail.textContent = message;
    }

    function startPlayer() {
      if (hls) {
        hls.destroy();
        hls = null;
      }

      quality.innerHTML = '<option value="-1">Otomatis</option>';
      qualityInfo.textContent =
        "Kualitas akan mengikuti pilihan yang tersedia dari server.";

      if (!STREAM_URL.startsWith("https://") ||
          STREAM_URL === "TEMPEL_URL_M3U8_DI_SINI") {
        setStatus("URL stream belum diisi", "error");
        setDetail("Edit STREAM_URL dan masukkan URL playlist .m3u8 yang valid.");
        return;
      }

      setStatus("Menghubungkan ke stream...", "");
      setDetail("Memuat playlist HLS...");

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          liveSyncDurationCount: 3,
          maxBufferLength: 20,
          capLevelToPlayerSize: false
        });

        hls.loadSource(STREAM_URL);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
          setStatus("Playlist berhasil dimuat", "online");
          setDetail("Playlist terbaca. Tekan Putar Live jika video belum berjalan.");

          quality.innerHTML = '<option value="-1">Otomatis</option>';

          data.levels.forEach(function(level, index) {
            const option = document.createElement("option");
            option.value = index;
            option.textContent = level.height
              ? level.height + "p"
              : "Kualitas " + (index + 1);
            quality.appendChild(option);
          });

          video.play().catch(function() {
            setStatus("Menunggu tombol putar", "");
            setDetail("Autoplay mungkin diblokir browser. Tekan Putar Live.");
          });
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, function(event, data) {
          const level = hls.levels[data.level];
          if (level) {
            qualityInfo.textContent =
              "Kualitas aktif: " + (level.height || "tidak diketahui") + "p";
          }
        });

        hls.on(Hls.Events.ERROR, function(event, data) {
          if (!data.fatal) return;

          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            setStatus("Gagal mengakses stream", "error");
            setDetail(
              "Periksa token URL, akses server, dan CORS. " +
              "Tekan Coba Lagi untuk mencoba koneksi ulang."
            );
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            setStatus("Memulihkan pemutar video", "");
            setDetail("Terjadi masalah media. Pemutar mencoba memulihkan video.");
            hls.recoverMediaError();
          } else {
            setStatus("Stream tidak dapat diputar", "error");
            setDetail("Periksa URL .m3u8 dan dukungan server terhadap browser.");
            hls.destroy();
            hls = null;
          }
        });

      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = STREAM_URL;
        video.play().catch(function() {
          setStatus("Tekan Putar Live", "");
        });
      } else {
        setStatus("HLS tidak didukung", "error");
        setDetail("Browser ini tidak mendukung pemutaran HLS secara native.");
      }
    }

    document.getElementById("playButton").addEventListener("click", function() {
      video.play().then(function() {
        setStatus("Pemutaran berjalan", "online");
      }).catch(function() {
        setStatus("Video belum bisa diputar", "error");
        setDetail("Periksa URL stream atau akses server.");
      });
    });

    document.getElementById("retryButton").addEventListener("click", startPlayer);

    document.getElementById("muteButton").addEventListener("click", function() {
      video.muted = !video.muted;
      this.textContent = video.muted
        ? "🔊 Aktifkan Suara"
        : "🔇 Matikan Suara";
      if (!video.muted) {
        video.play().catch(function() {});
      }
    });

    quality.addEventListener("change", function() {
      if (hls) {
        hls.currentLevel = Number(this.value);
      }
    });

    video.addEventListener("playing", function() {
      setStatus("Video sedang diputar", "online");
    });

    video.addEventListener("waiting", function() {
      setStatus("Buffering...", "");
    });

    video.addEventListener("error", function() {
      setStatus("Video mengalami error", "error");
      setDetail("Browser gagal membaca video. Periksa URL dan akses server.");
    });

    startPlayer();
  </script>
</body>
</html>
