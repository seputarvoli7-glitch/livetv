<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    background:#000;
}
video{
    width:100%;
    height:100vh;
    background:#000;
}
    .watermark{
    position: fixed;
    top: 15px;
    right: 15px;
    color: white;
    font-size: 24px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    text-shadow: 2px 2px 5px #000;
    opacity: 0.8;
    z-index: 9999;
    pointer-events: none;
    }
</style>
</head>
<body>
<div class="watermark">MegawatiRedspark</div>
<video id="video" controls autoplay playsinline></video>

<script>
const video = document.getElementById("video");
const streamUrl = "https://livecdn.euw1-0008.jwplive.com/live/sites/fM9jRrkn/media/PEbI6ecX/live.isml/master.m3u8";
if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play();
    });
} else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = streamUrl;
}
</script>

</body>
</html>
