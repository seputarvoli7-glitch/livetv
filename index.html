<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    background:#000;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

.player{
    position:relative;
    width:100%;
    height:100vh;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.watermark{
    position:absolute;
    top:40%;
    right:5%;
    transform:translateY(-50%);
    color:rgba(255,255,255,.6);
    font-size:14px;
    font-weight:bold;
    text-shadow:1px 1px 2px #000;
    pointer-events:none;
}
</style>

</head>

<body>

<div class="player">

<video id="video" controls autoplay playsinline></video>

<div class="watermark">
MegawatiRedspark
</div>

</div>


<script>

const url = "https://livecdn.euw1-0008.jwplive.com/live/sites/fM9jRrkn/media/PA9u74As/live.isml/master.m3u8";

const video = document.getElementById("video");


if (Hls.isSupported()) {

    const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        maxBufferLength: 30
    });

    hls.loadSource(url);
    hls.attachMedia(video);


    hls.on(Hls.Events.MANIFEST_PARSED, function(){

        console.log("Stream siap");

    });


    hls.on(Hls.Events.ERROR, function(event, data){

        console.log("Error:", data);

    });


} else if (video.canPlayType("application/vnd.apple.mpegurl")) {

    video.src = url;

}

</script>

</body>
</html>
