<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

.player{
    position:relative;
    width:100%;
    height:100%;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.watermark{
    position:absolute;
    top:38%;
    right:5%;
    color:rgba(255,255,255,.6);
    font-size:15px;
    font-weight:bold;
    text-shadow:1px 1px 3px #000;
    pointer-events:none;
}

#status{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0,0,0,.8);
    color:#00ff00;
    font-size:12px;
    padding:8px;
    z-index:9999;
    word-break:break-word;
}
</style>

</head>

<body>

<div class="player">

<video id="video" controls autoplay playsinline></video>

<div class="watermark">
MegawatiRedspark
</div>

</div>

<div id="status">
Memuat stream...
</div>

<script>

const url="https://livecdn.euw1-0008.jwplive.com/live/sites/fM9jRrkn/media/pNQ7MbHn/live.isml/live-video=4499968.m3u8";
const video=document.getElementById("video");
const status=document.getElementById("status");

function setStatus(teks,warn="#00ff00"){
    status.style.color=warn;
    status.innerText=teks;
}

if(Hls.isSupported()){

    const hls=new Hls({
        debug:true,
        enableWorker:true,
        lowLatencyMode:false,
        backBufferLength:90,
        maxBufferLength:30
    });

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_LOADING,function(){
        setStatus("Memuat manifest...");
    });

    hls.on(Hls.Events.MANIFEST_PARSED,function(){

        setStatus("Manifest berhasil dimuat. Memulai video...");

        setStatus("Tekan tombol ▶ untuk memulai video");

    });

    video.addEventListener("playing",function(){
        status.style.display="none";
    });

    video.addEventListener("waiting",function(){
        status.style.display="block";
        setStatus("Buffering...");
    });

    hls.on(Hls.Events.ERROR,function(event,data){

        status.style.display="block";

        setStatus(
            "TYPE : "+data.type+
            "\nDETAIL : "+data.details+
            "\nFATAL : "+data.fatal,
            "red"
        );

        if(data.fatal){

            switch(data.type){

                case Hls.ErrorTypes.NETWORK_ERROR:
                    hls.startLoad();
                    break;

                case Hls.ErrorTypes.MEDIA_ERROR:
                    hls.recoverMediaError();
                    break;

                default:
                    hls.destroy();

            }

        }

    });

}else if(video.canPlayType("application/vnd.apple.mpegurl")){

    video.src=url;

    video.addEventListener("loadedmetadata",function(){
        video.play();
    });

}else{

    setStatus("Browser tidak mendukung HLS","red");

}

</script>

</body>
</html>
