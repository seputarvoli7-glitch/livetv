<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
const video = document.getElementById('video');
const status = document.getElementById('status');

const streamUrl = 'https://ex-nlive-streaming.navercdn.com/chzzk/lip2_kr/cflexnmss2u0006/ei0bktmf1tr7ipud6ewyw7g6k9ovp6slacu3/144p/hdntl=st%3d1791692504~exp%3d1791753714~acl%3d*%2fei0bktmf1tr7ipud6ewyw7g6k9ovp6slacu3%2f*~data%3dhdntl~hmac%3d6b172a83c3a69b8c3f04b312476d2313bd4732f413a3bf8d399ad7a07f2a40ce/gnb4jzbrdg1crcypxlt77r09ovp6sla8n3_hls_chunklist.m3u8?vp=47DEQpj8HBSa-_TIHH81HaCbnxOCk3lZ9Bo6Cw';

if (Hls.isSupported()) {
  const hls = new Hls({
    enableWorker: true,
    lowLatencyMode: false,
    debug: false
  });

  hls.on(Hls.Events.ERROR, (event, data) => {
    console.error('HLS error:', data);
    status.textContent =
      'Error: ' + data.details +
      (data.response?.code ? ' | HTTP ' + data.response.code : '');
  });

  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    status.textContent = 'Playlist terbaca. Tekan Play.';
  });

  hls.loadSource(streamUrl);
  hls.attachMedia(video);

} else {
  status.textContent =
    'Browser tidak mendukung Media Source Extensions untuk HLS.';
}
</script>
