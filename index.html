<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Channel 33 - HLS Live</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}
.container{width:min(100%,1000px);margin:auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}.player{width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:10px}
video{width:100%;height:100%;display:block;background:#000}.status{margin-top:10px;padding:10px 12px;background:#181818;border-radius:8px;font-size:14px}
.buttons{margin-top:10px;display:flex;gap:8px}button{border:0;border-radius:7px;padding:10px 14px;font-size:14px}
.note{margin-top:10px;color:#aaa;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<main class="container">
<h1>Channel 33 — HLS Live</h1>
<div class="player"><video id="video" controls playsinline preload="none"></video></div>
<div id="status" class="status">Menghubungkan ke stream...</div>
<div class="buttons"><button id="play">▶ Putar</button><button id="reload">↻ Muat ulang</button></div>
<div class="note">Jika muncul CORS atau 403, server sumber menolak request dari GitHub Pages. JavaScript browser tidak dapat memaksa header Referer tertentu.</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const STREAM_URL='https://live2.livefeedtextbox.com/live/channel33.m3u8';
const video=document.getElementById('video');
const status=document.getElementById('status');
const playButton=document.getElementById('play');
const reloadButton=document.getElementById('reload');
let hls=null;

function setStatus(t){status.textContent=t}
function destroyHls(){
  if(hls){hls.destroy();hls=null}
  video.removeAttribute('src');video.load();
}
function startPlayer(){
  destroyHls();setStatus('Menghubungkan ke Channel 33...');
  if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=STREAM_URL;
    video.addEventListener('loadedmetadata',()=>setStatus('Stream siap. Tekan Putar.'),{once:true});
    video.addEventListener('error',()=>setStatus('Gagal memuat HLS. Periksa CORS/akses server.'),{once:true});
    return;
  }
  if(window.Hls && Hls.isSupported()){
    hls=new Hls({enableWorker:true,lowLatencyMode:true,backBufferLength:30,maxBufferLength:20,manifestLoadingMaxRetry:3,levelLoadingMaxRetry:3,fragLoadingMaxRetry:3});
    hls.loadSource(STREAM_URL);hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>setStatus('Playlist HLS berhasil dimuat. Tekan Putar.'));
    hls.on(Hls.Events.ERROR,(event,data)=>{
      console.log('HLS error:',data);
      if(!data.fatal)return;
      if(data.type===Hls.ErrorTypes.NETWORK_ERROR)setStatus('Network error. Kemungkinan CORS, 403, Referer, atau koneksi server.');
      else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){setStatus('Media error. Mencoba memulihkan player...');hls.recoverMediaError()}
      else{setStatus('HLS error fatal: '+data.details);destroyHls()}
    });
    return;
  }
  setStatus('Browser ini tidak mendukung HLS.js.');
}
playButton.addEventListener('click',()=>video.play().then(()=>setStatus('Sedang memutar Channel 33.')).catch(()=>setStatus('Tekan tombol Play pada video.')));
reloadButton.addEventListener('click',startPlayer);
startPlayer();
</script>
</body>
</html>
