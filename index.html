<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="YANSTREAM Live Player">
  <title>YANSTREAM - Live Player</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #080b12;
      color: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    header {
      padding: 18px 0;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .logo span { color: #35d7ff; }

    .subtitle {
      color: #9aa5b5;
      font-size: 12px;
      margin-top: 7px;
    }

    .player-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid #242b39;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .watermark {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      background: #0009;
      padding: 7px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
      pointer-events: none;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 14px 0;
      color: #aab4c4;
      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: #e8ae36;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.online { background: #35df91; }
    .dot.error { background: #ff5268; }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 16px;
    }

    button, select {
      border: 1px solid #30394a;
      border-radius: 8px;
      background: #171e2b;
      color: white;
      padding: 12px 15px;
      font-size: 14px;
    }

    button { cursor: pointer; }
    button:active { opacity: .75; }

    button.primary {
      background: #087fce;
      border-color: #087fce;
      font-weight: bold;
    }

    .panel {
      background: #111722;
      border: 1px solid #242b39;
      border-radius: 10px;
      padding: 15px;
      margin-top: 14px;
    }

    .panel h3 {
      font-size: 15px;
      margin: 0 0 10px;
    }

    .panel p {
      color: #aab4c4;
      font-size: 13px;
      line-height: 1.6;
      margin: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .quality-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .quality-row h3 { margin: 0; }

    select { max-width: 100%; }

    footer {
      text-align: center;
      color: #687386;
      font-size: 12px;
      padding: 25px 0 10px;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="logo">YAN<span>STREAM</span></div>
      <div class="subtitle">LIVE PLAYER · HLS STREAMING</div>
    </header>

    <div class="player-box">
      <div class="watermark">YANSTREAM</div>
      <video id="video"
        controls
        playsinline
        autoplay
        muted
        preload="auto"></video>
    </div>

    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">Menyiapkan pemutar...</span>
    </div>

    <div class="controls">
      <button id="playButton" class="primary">▶ Putar Live</button>
      <button id="retryButton">↻ Coba Lagi</button>
      <button id="muteButton">🔊 Aktifkan Suara</button>
    </div>

    <section class="panel">
      <div class="quality-row">
        <h3>Kualitas Video</h3>
        <select id="quality">
          <option value="-1">Otomatis</option>
        </select>
      </div>
      <p id="qualityInfo" style="margin-top:10px">
        Menunggu informasi kualitas dari server.
      </p>
    </section>

    <section class="panel">
      <h3>Status Pemutar</h3>
      <p id="detail">Memulai koneksi HLS...</p>
    </section>

    <footer>YANSTREAM · Live Player</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>

  <script>
    const video = document.getElementById("video");
    const statusText = document.getElementById("statusText");
    const dot = document.getElementById("dot");
    const detail = document.getElementById("detail");
    const quality = document.getElementById("quality");
    const qualityInfo = document.getElementById("qualityInfo");
    const playButton = document.getElementById("playButton");
    const retryButton = document.getElementById("retryButton");
    const muteButton = document.getElementById("muteButton");

    // Satu URL playlist HLS.
    // Jika token kedaluwarsa, ganti dengan URL terbaru.
    const STREAM_URL = "https://fhlsport550.tbad162gof.xyz/token-JUZ9zuadKaWGvmx6x%2FY6yzjRlMDb0y3jaiStzvJLEjHy4%2BWbHUFbDpQtrAtJWUgGRX%2Fb3zVnmv1zdZZHUkcY%2F5MxSE2xNA%3D%3Da/cfall/s2001/v3b/7593p4s3nUE0pQbiY3EmAmphZ3umqT0lYz9hMD%3D%3D/super/3x_876262.m3u8";

    let hls = null;
    let retryTimer = null;
    let generation = 0;

    function setStatus(message, state = "") {
      statusText.textContent = message;
      dot.className = "dot" + (state ? " " + state : "");
    }

    function setDetail(message) {
      detail.textContent = message;
    }

    function stopPlayer() {
      generation++;

      if (retryTimer) {
        clearTimeout(retryTimer);
        retryTimer = null;
      }

      if (hls) {
        hls.destroy();
        hls = null;
      }

      video.pause();
      video.removeAttribute("src");
      video.load();
    }

    function scheduleRetry() {
      if (retryTimer) clearTimeout(retryTimer);

      const currentGeneration = generation;

      retryTimer = setTimeout(() => {
        if (currentGeneration === generation) {
          startPlayer();
        }
      }, 5000);
    }

    function startPlayer() {
      stopPlayer();
      const currentGeneration = generation;

      quality.innerHTML = '<option value="-1">Otomatis</option>';
      qualityInfo.textContent =
        "Menunggu informasi kualitas dari server.";

      setStatus("Menghubungkan ke stream...");
      setDetail("Memuat playlist HLS. Mohon tunggu.");

      if (!STREAM_URL.startsWith("https://")) {
        setStatus("URL tidak valid", "error");
        setDetail("STREAM_URL harus berupa URL HTTPS.");
        return;
      }

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          liveSyncDurationCount: 3,
          maxBufferLength: 20,
          capLevelToPlayerSize: false,
          manifestLoadingTimeOut: 15000,
          levelLoadingTimeOut: 15000,
          fragLoadingTimeOut: 20000,
          manifestLoadingMaxRetry: 2,
          levelLoadingMaxRetry: 2,
          fragLoadingMaxRetry: 2
        });

        hls.loadSource(STREAM_URL);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
          if (currentGeneration !== generation) return;

          setStatus("Playlist berhasil dimuat", "online");
          setDetail(
            "Playlist terbaca. Pemutar mencoba menjalankan video."
          );

          quality.innerHTML = '<option value="-1">Otomatis</option>';

          data.levels.forEach((level, index) => {
            const option = document.createElement("option");
            option.value = index;
            option.textContent = level.height
              ? level.height + "p"
              : "Kualitas " + (index + 1);
            quality.appendChild(option);
          });

          qualityInfo.textContent = data.levels.length
            ? "Pilihan kualitas tersedia: " +
              data.levels.map(level => level.height
                ? level.height + "p"
                : "lainnya").join(", ")
            : "Server belum memberikan daftar kualitas.";

          video.play().catch(() => {
            if (currentGeneration !== generation) return;
            setStatus("Tekan Putar Live", "");
            setDetail(
              "Autoplay diblokir browser atau video belum siap. " +
              "Tekan tombol Putar Live."
            );
          });
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {
          if (currentGeneration !== generation || !hls) return;

          const level = hls.levels[data.level];
          if (level) {
            qualityInfo.textContent =
              "Kualitas aktif: " +
              (level.height ? level.height + "p" : "tidak diketahui");
          }
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (currentGeneration !== generation || !data.fatal) return;

          const httpStatus =
            data.response && data.response.code
              ? data.response.code
              : "tidak tersedia";

          setStatus("Gagal memuat stream", "error");
          setDetail(
            "Jenis error: " + data.type +
            "\nDetail: " + data.details +
            "\nHTTP: " + httpStatus +
            "\n\nPeriksa token URL, koneksi, dan izin akses server."
          );

          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            // Coba pulihkan jaringan satu kali melalui mekanisme hls.js.
            hls.startLoad();
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          } else {
            hls.destroy();
            hls = null;
          }
        });

      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        // Pemutaran HLS native pada browser yang mendukungnya.
        video.src = STREAM_URL;

        video.play().catch(() => {
          setStatus("Tekan Putar Live", "");
          setDetail("Tekan tombol Putar Live untuk mencoba memutar video.");
        });
      } else {
        setStatus("HLS tidak didukung", "error");
        setDetail(
          "Browser tidak mendukung HLS secara native dan hls.js tidak tersedia."
        );
      }
    }

    playButton.addEventListener("click", () => {
      video.play().then(() => {
        setStatus("Video sedang diputar", "online");
      }).catch(() => {
        setStatus("Video belum bisa diputar", "error");
        setDetail(
          "Periksa error di atas. Jika terkait CORS atau HTTP 403, " +
          "masalahnya perlu diperiksa pada sumber stream."
        );
      });
    });

    retryButton.addEventListener("click", startPlayer);

    muteButton.addEventListener("click", () => {
      video.muted = !video.muted;
      muteButton.textContent = video.muted
        ? "🔊 Aktifkan Suara"
        : "🔇 Matikan Suara";

      if (!video.muted) {
        video.play().catch(() => {});
      }
    });

    quality.addEventListener("change", () => {
      if (hls) {
        hls.currentLevel = Number(quality.value);
      }
    });

    video.addEventListener("playing", () => {
      setStatus("Video sedang diputar", "online");
    });

    video.addEventListener("waiting", () => {
      setStatus("Buffering...", "");
    });

    video.addEventListener("error", () => {
      setStatus("Video mengalami error", "error");

      if (video.error) {
        setDetail(
          "Kode error media browser: " + video.error.code +
          "\nPeriksa URL playlist dan akses server."
        );
      }
    });

    // Mulai otomatis saat halaman dibuka.
    startPlayer();
  </script>
</body>
</html>
