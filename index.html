<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DASH Player</title>

<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
    }

    .player {
        width: 100%;
        max-width: 1000px;
        margin: auto;
        background: #000;
    }

    video {
        width: 100%;
        display: block;
        background: #000;
    }

    .info {
        padding: 10px;
        background: #111;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="player">

    <video
        id="video"
        controls
        playsinline
        crossorigin="anonymous">
    </video>

    <div id="status" class="info">
        Memuat stream...
    </div>

</div>

<script>

const MPD_URL =
"https://ls-mp04.eo-edgefunctions7.com/out/v1/4604623e7ff4462a962275664ccd8ee5/manifest.mpd";

const video =
document.getElementById("video");

const status =
document.getElementById("status");


const player =
dashjs.MediaPlayer().create();


player.initialize(
    video,
    MPD_URL,
    false
);


/* DASH berhasil dimuat */

player.on(
    dashjs.MediaPlayer.events.STREAM_INITIALIZED,
    function () {

        status.textContent =
            "Stream siap. Tekan PLAY.";

        console.log(
            "DASH STREAM INITIALIZED"
        );

    }
);


/* Error */

player.on(
    dashjs.MediaPlayer.events.ERROR,
    function (e) {

        console.error(
            "DASH ERROR:",
            e
        );

        status.textContent =
            "DASH error. Lihat Console.";

    }
);


/* Buffering */

player.on(
    dashjs.MediaPlayer.events.BUFFER_LOADED,
    function () {

        status.textContent =
            "Stream siap.";

    }
);

</script>

</body>
</html>
