
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YANSTREAM IPTV</title>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 15px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }
    h2 { color: #00d084; }
    video {
      width: 100%;
      background: black;
    }
  </style>
</head>
<body>
  <h2>YANSTREAM IPTV</h2>
  <video id="video" controls autoplay playsinline></video>
  <p id="status">Menghubungkan ke stream...</p>

  <script>
    const url = "https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/b3b3fkmrbl/out/v1/1084d5c9a97a4c5b9f9554c88f486646/cenc.mpd";
    const video = document.getElementById("video");
    const status = document.getElementById("status");
    const player = dashjs.MediaPlayer().create();

    player.on("error", function () {
      status.textContent =
        "Gagal memutar. Periksa akses, CORS, atau DRM.";
    });

    player.on("streamInitialized", function () {
      status.textContent = "Stream berhasil dimuat.";
    });

    player.initialize(video, url, false);
  </script>
</body>
</html>
