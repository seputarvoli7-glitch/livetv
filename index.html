<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
}

.player{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
}

video{
    width:100%;
    max-height:100%;
    background:#000;
}

.watermark{
    position:absolute;
    top:8%;
    right:5%;
    color:rgba(255,255,255,.65);
    font-size:12px;
    font-weight:bold;
    font-family:Arial,sans-serif;
    text-shadow:1px 1px 3px #000;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="player">
    <video id="video" controls autoplay playsinline></video>
    <div class="watermark">MegawatiRedspark</div>
</div>

<script>
const MASTER_URL = "https://seputarvoli7-glitch.github.io/livetv/master.m3u8";

const video = document.getElementById("video");

if (Hls.isSupported()) {
    const hls = new Hls({
        enableWorker:true,
        lowLatencyMode:true
    });

    hls.loadSource(MASTER_URL);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play().catch(()=>{});
    });

    hls.on(Hls.Events.ERROR, function(event, data){
        console.log("HLS Error:", data);
    });

} else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = MASTER_URL;
}
</script>

</body>
</html>
