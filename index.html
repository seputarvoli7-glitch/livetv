<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

.player{
    position:relative;
    width:100%;
    height:100%;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.watermark{
    position:absolute;
    top:38%;
    right:5%;
    color:rgba(255,255,255,.6);
    font-size:15px;
    font-weight:bold;
    text-shadow:1px 1px 3px #000;
    pointer-events:none;
}

#status{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0,0,0,.8);
    color:#00ff00;
    font-size:12px;
    padding:8px;
    z-index:9999;
    word-break:break-word;
}
</style>

</head>

<body>

<div class="player">

<video id="video" controls autoplay playsinline></video>

<div class="watermark">
MegawatiRedspark
</div>

</div>

<div id="status">
Memuat stream...
</div>

<script>

const url = "https://livecdn.euw1-0008.jwplive.com/live/sites/fM9jRrkn/media/pNQ7MbHn/live.isml/master.m3u8";

const video = document.getElementById("video");

if (Hls.isSupported()) {

    const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: false,
        maxBufferLength: 10,
        backBufferLength: 10,
        maxMaxBufferLength: 20,
        startLevel: 2,      // mulai di 540p
        capLevelToPlayerSize: true,
        autoStartLoad: true
    });

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function () {

        // Kunci kualitas di 540p
        hls.currentLevel = 2;

    });

    video.addEventListener("play", function () {
        video.play().catch(()=>{});
    });

    hls.on(Hls.Events.ERROR, function (event, data) {

        console.log(data);

        if (data.details === "bufferFullError") {

            hls.currentLevel = 1; // turun ke 360p bila buffer penuh

        }

    });

} else if (video.canPlayType("application/vnd.apple.mpegurl")) {

    video.src = url;

}

</script>

</body>
</html>
