<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Player</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.0/shaka-player.compiled.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }
  </style>
</head>

<body>

<video id="video" controls autoplay playsinline></video>

<script>
  async function init() {
    const video = document.getElementById("video");

    shaka.polyfill.installAll();

    if (!shaka.Player.isBrowserSupported()) {
      alert("Browser tidak mendukung pemutar DASH.");
      return;
    }

    const player = new shaka.Player();
    await player.attach(video);

    const mpdUrl =
      "https://d10btucg50kagt.cloudfront.net/6666c6d0c7e10e0ee0be55f5/684ad0046b24126facf6347e/3BgqgwsaHV9Q/2026/8/28/15_16_56/index.m3u8";

    player.addEventListener("error", event => {
      console.error("Shaka Error:", event.detail);
    });

    try {
      await player.load(mpdUrl);
      console.log("MPD berhasil dimuat.");

      video.muted = true;
      await video.play().catch(() => {});
    } catch (error) {
      console.error("Gagal memutar MPD:", error);
    }
  }

  document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
