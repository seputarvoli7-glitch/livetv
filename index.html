<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    width:100vw;
    height:100vh;
    overflow:hidden;
}
.player{
    position:relative;
    width:100%;
}
video{
    width:100%;
    display:block;
    background:#000;
}
.watermark{
    position:absolute;
    top:8%;
    right:5%;
    color:rgba(255,255,255,.6);
    font-size:12px;
    font-weight:bold;
    text-shadow:1px 1px 2px #000;
    pointer-events:none;
}
#log{
    color:#0f0;
    font-size:12px;
    white-space:pre-wrap;
    padding:10px;
    font-family:monospace;
}
</style>
</head>

<body>

<div class="player">
    <video id="video" controls autoplay playsinline></video>
    <div class="watermark">MegawatiRedspark</div>
</div>

<pre id="log">Memuat stream...</pre>

<script>
const url = "https://livecdn.euw1-0008.jwplive.com/live/sites/fM9jRrkn/media/8TBQDKh6/live.isml/master.m3u8";

const video=document.getElementById("video");
const log=document.getElementById("log");

function tulis(teks){
    console.log(teks);
    log.textContent+= "\n"+teks;
}

if(Hls.isSupported()){

    const hls=new Hls({
        enableWorker:true,
        lowLatencyMode:true
    });

    hls.loadSource(MASTER_URL);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_LOADING,()=>{
        tulis("Memuat master playlist...");
    });

    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
        tulis("Master berhasil dimuat.");
        video.play().catch(()=>{});
    });

    hls.on(Hls.Events.LEVEL_LOADED,()=>{
        tulis("Video playlist berhasil dimuat.");
    });

    hls.on(Hls.Events.AUDIO_TRACK_LOADED,()=>{
        tulis("Audio playlist berhasil dimuat.");
    });

    hls.on(Hls.Events.ERROR,(event,data)=>{
        tulis("ERROR:");
        tulis(JSON.stringify(data,null,2));
    });

}else if(video.canPlayType("application/vnd.apple.mpegurl")){

    video.src=MASTER_URL;

}else{

    tulis("Browser tidak mendukung HLS.");
}
</script>

</body>
</html>
