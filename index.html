<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV</title>

<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#videoPlayer{
    width:100%;
    height:100%;
    object-fit:contain;
}

#watermark{
    position:absolute;
    top:15px;
    left:15px;
    color:#fff;
    font-size:22px;
    font-weight:bold;
    font-family:Arial,sans-serif;
    text-shadow:2px 2px 5px #000;
    z-index:999;
    pointer-events:none;
}
</style>
</head>
<body>

<div id="watermark">MegawatiRedspark</div>

<video id="videoPlayer" controls autoplay playsinline></video>

<script>
const url = "http://gvisiontv.channell.my.id/ch/th/th1.php/.mpd?=29";

const player = dashjs.MediaPlayer().create();
player.initialize(document.querySelector("#videoPlayer"), url, true);

player.updateSettings({
    streaming: {
        lowLatencyEnabled: true,
        fastSwitchEnabled: true
    }
});
</script>

</body>
</html>
