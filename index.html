<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phaohoa 6 Live</title>
  <style>
    body { margin:0; background:#111; color:#fff; font-family:Arial,sans-serif; }
    .wrap { max-width:1000px; margin:auto; padding:16px; }
    h1 { font-size:20px; margin:0 0 12px; }
    video { width:100%; height:auto; background:#000; display:block; }
    #status { padding:10px 0; font-size:14px; color:#ccc; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Phaohoa 6 Live</h1>
    <video id="video" controls autoplay playsinline></video>
    <div id="status">Memuat stream...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const stream = 'https://luong.phaohoa.live/live/phaohoa6/index.m3u8';

    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = stream;
      video.addEventListener('loadedmetadata', () => {
        status.textContent = 'Stream siap diputar.';
        video.play().catch(() => {});
      });
    } else if (Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
      });

      hls.loadSource(stream);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        status.textContent = 'Stream siap diputar.';
        video.play().catch(() => {});
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        console.log('HLS error:', data);
        status.textContent = 'Gagal memuat stream. Cek CORS, Referer, atau apakah server stream masih aktif.';
      });
    } else {
      status.textContent = 'Browser ini tidak mendukung pemutaran HLS.';
    }
  </script>
</body>
</html>
