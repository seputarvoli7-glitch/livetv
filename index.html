<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Player</title>

    <script src="https://cdn.dashjs.org/latest/modern/umd/dash.all.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        video {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background: #000;
        }
    </style>
</head>

<body>

<video id="videoPlayer" controls autoplay playsinline></video>

<script>
    const url = "https://tglmp02.akamaized.net/out/v1/2f39077458694b06bdfb15ef16f55d45/manifest.mpd";

    const player = dashjs.MediaPlayer().create();

    player.initialize(
        document.querySelector("#videoPlayer"),
        url,
        true
    );
</script>

</body>
</html>
